{% extends 'base.html' %}{% block content %}
<h1 class="cyan">[ 设置中心 ]</h1>
<p class="gray">请选择一个设置项目。</p>
<div class="settings-menu">
  {% if user.role == 'admin' %}<a class="settings-option" href="/settings/models"><b>模型 API</b><span>添加、修改、启用模型接口</span><i>›</i></a>
  <a class="settings-option" href="/settings/mcp"><b>MCP 服务</b><span>配置 Streamable HTTP / SSE 服务</span><i>›</i></a>
  <a class="settings-option" href="/settings/skills"><b>Skill 管理</b><span>查看已加载的 Skill 说明</span><i>›</i></a>
  <a class="settings-option" href="/settings/appearance"><b>个性化设置</b><span>站点名称、主题和欢迎语</span><i>›</i></a>{% endif %}
  <a class="settings-option" href="/settings/password"><b>修改密码</b><span>更新当前账户密码</span><i>›</i></a>
</div>
<div class="actions"><a class="nav-button" href="/chat">返回聊天</a>{% if user.role == 'admin' %}<a class="nav-button" href="/AdminX">管理员控制台</a>{% endif %}<button id="logout" class="nav-button">注销</button></div>
<script>document.getElementById('logout').onclick=function(){fetch('/logout',{method:'POST'}).then(function(){location='/login'})};</script>
{% endblock %}
