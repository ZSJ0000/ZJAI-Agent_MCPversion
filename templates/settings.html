{% extends 'base.html' %}{% block content %}
<h1 class="cyan">[ 设置中心 ]</h1>
<p class="gray">管理模型 API、MCP 服务、个性化设置和账户密码。</p>
<div id="message"></div>
<section class="panel"><h2>模型 API</h2><div id="models"></div><button id="add-model" class="nav-button">添加模型 API</button><button id="save-models" class="nav-button primary">保存模型配置</button></section>
<section class="panel"><h2>MCP 服务</h2><div id="mcp"></div><button id="add-mcp" class="nav-button">添加 MCP 服务</button><button id="save-mcp" class="nav-button primary">保存 MCP 配置</button></section>
<section class="panel"><h2>个性化设置</h2><label>站点名称</label><input id="site-name"><label>默认欢迎语</label><textarea id="welcome"></textarea><button id="save-app" class="nav-button primary">保存个性化设置</button></section>
<section class="panel"><h2>修改密码</h2><input id="current-password" type="password" placeholder="当前密码"><input id="new-password" type="password" placeholder="新密码（至少 6 位）"><button id="save-password" class="nav-button primary">修改密码</button></section>
<div class="actions"><a class="nav-button" href="/chat">返回聊天</a>{% if user.role == 'admin' %}<a class="nav-button" href="/AdminX">管理员控制台</a>{% endif %}<button id="logout" class="nav-button">注销</button></div>
<script>
(function(){var msg=document.getElementById('message');function say(t,e){msg.textContent=t;msg.className=e?'error':'success'}function api(url,opt){return fetch(url,opt).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.error||'请求失败');return x})})}function modelRow(x){var d=document.createElement('div');d.className='setting-row';d.innerHTML='<input class="m-name" placeholder="名称"><input class="m-url" placeholder="Base URL"><input class="m-key" type="password" placeholder="API Key（留空表示不修改）"><input class="m-model" placeholder="模型标识"><label><input class="m-enabled" type="checkbox" checked>启用</label><button type="button" class="remove">删除</button>';d.querySelector('.m-name').value=x.name||'';d.querySelector('.m-url').value=x.base_url||'';d.querySelector('.m-model').value=x.model||'';d.querySelector('.m-enabled').checked=x.enabled!==false;d.dataset.id=x.id||'';d.querySelector('.remove').onclick=function(){d.remove()};return d}function mcpRow(x){var d=document.createElement('div');d.className='setting-row';d.innerHTML='<input class="s-name" placeholder="名称"><input class="s-url" placeholder="MCP URL"><select class="s-protocol"><option value="streamable_http">Streamable HTTP</option><option value="sse">SSE</option></select><input class="s-token" type="password" placeholder="Token（留空表示不修改）"><label><input class="s-enabled" type="checkbox" checked>启用</label><button type="button" class="remove">删除</button>';d.querySelector('.s-name').value=x.name||'';d.querySelector('.s-url').value=x.url||'';d.querySelector('.s-protocol').value=x.protocol||'streamable_http';d.querySelector('.s-enabled').checked=x.enabled!==false;d.dataset.id=x.id||'';d.querySelector('.remove').onclick=function(){d.remove()};return d}function load(){api('/AdminX/api/settings').then(function(x){document.getElementById('site-name').value=x.app.name||'';document.getElementById('welcome').value=x.app.welcome_message||'';x.models.forEach(function(m){document.getElementById('models').appendChild(modelRow(m))});x.mcp.forEach(function(s){document.getElementById('mcp').appendChild(mcpRow(s))})}).catch(function(e){say(e.message,true)})}document.getElementById('add-model').onclick=function(){document.getElementById('models').appendChild(modelRow({}))};document.getElementById('add-mcp').onclick=function(){document.getElementById('mcp').appendChild(mcpRow({}))};document.getElementById('save-models').onclick=function(){var arr=[];document.querySelectorAll('#models .setting-row').forEach(function(d){arr.push({id:d.dataset.id,name:d.querySelector('.m-name').value,base_url:d.querySelector('.m-url').value,api_key:d.querySelector('.m-key').value,model:d.querySelector('.m-model').value,enabled:d.querySelector('.m-enabled').checked})});api('/AdminX/api/models',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({models:arr})}).then(function(){say('模型配置已保存')}).catch(function(e){say(e.message,true)})};document.getElementById('save-mcp').onclick=function(){var arr=[];document.querySelectorAll('#mcp .setting-row').forEach(function(d){arr.push({id:d.dataset.id,name:d.querySelector('.s-name').value,url:d.querySelector('.s-url').value,protocol:d.querySelector('.s-protocol').value,headers:d.querySelector('.s-token').value?{Authorization:'Bearer '+d.querySelector('.s-token').value}: {},enabled:d.querySelector('.s-enabled').checked})});api('/AdminX/api/mcp',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({servers:arr})}).then(function(){say('MCP 配置已保存')}).catch(function(e){say(e.message,true)})};document.getElementById('save-app').onclick=function(){api('/AdminX/api/app-settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('site-name').value,welcome_message:document.getElementById('welcome').value})}).then(function(){say('个性化设置已保存')}).catch(function(e){say(e.message,true)})};document.getElementById('save-password').onclick=function(){api('/api/account/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:document.getElementById('current-password').value,new_password:document.getElementById('new-password').value})}).then(function(){say('密码已修改')}).catch(function(e){say(e.message,true)})};document.getElementById('logout').onclick=function(){fetch('/logout',{method:'POST'}).then(function(){location='/login'})};load()})();
</script>{% endblock %}
