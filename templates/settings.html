{% extends 'base.html' %}{% block content %}<h1>[ 设置中心 ]</h1><p class="gray">API Key 和 MCP Token 仅由后端读取，不会返回页面。</p><div class="panel"><h2>模型</h2><div id="models">加载中...</div><h2>MCP 工具</h2><div id="tools">加载中...</div></div><a class="button" href="/chat">[ 返回聊天 ]</a>{% if user.role == 'admin' %}<a class="button" href="/AdminX">[ 管理员控制台 ]</a>{% endif %}<button onclick="fetch('/logout',{method:'POST'}).then(function(){location='/login'})">[ 注销 ]</button><script>fetch('/api/models').then(function(r){return r.json()}).then(function(x){document.getElementById('models').textContent=x.models.map(function(m){return m.name+' ['+m.id+']'}).join('\n')||'未配置模型'});fetch('/api/mcp/tools').then(function(r){return r.json()}).then(function(x){document.getElementById('tools').textContent=x.tools.map(function(t){return t.name}).join('\n')||'未发现 MCP 工具'});</script>{% endblock %}
