{% extends 'base.html' %}{% block content %}
<div class="setup-shell"><div class="setup-head"><span class="cyan">[ ZJAI-AGENT ]</span><span>初始化向导</span></div>
<div class="steps"><span class="active">01 欢迎</span><span>02 管理员账号</span><span>03 API 配置</span><span>04 个性化</span></div>
{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post" id="setup-form">
<section class="step active" data-step="1"><h1>欢迎使用</h1><p>欢迎安装 ZJAI-Agent_MCPversion。</p><p class="gray">本向导将依次完成管理员账号、多个 OpenAI 兼容 API 和个性化设置。</p><button type="button" data-next>[ 下一步 ]</button></section>
<section class="step" data-step="2"><h1>配置管理员账号</h1><label>管理员账号</label><input name="username" required><label>管理员密码（至少 6 位）</label><input type="password" name="password" required><label>确认密码</label><input type="password" name="confirm" required><div class="actions"><button type="button" data-prev>[ 上一步 ]</button><button type="button" data-next>[ 下一步 ]</button></div></section>
<section class="step" data-step="3"><h1>配置 API</h1><p class="gray">可添加多个 OpenAI 兼容接口，本地和云端均可使用。</p><div id="apis"></div><button type="button" id="add-api">[ 添加 API ]</button><div class="actions"><button type="button" data-prev>[ 上一步 ]</button><button type="button" data-next>[ 下一步 ]</button></div></section>
<section class="step" data-step="4"><h1>个性化设置</h1><label>站点名称</label><input name="site_name" value="ZJAI-Agent_MCPversion" required><label>界面主题</label><select name="theme"><option value="terminal">终端黑绿</option><option value="green">经典绿屏</option></select><label>默认欢迎语</label><textarea name="welcome_message">欢迎使用 ZJAI-Agent_MCPversion。</textarea><label>MCP 服务地址（可留空）</label><input name="mcp_url" placeholder="http://127.0.0.1:9000/mcp"><label>MCP 协议</label><select name="mcp_protocol"><option value="streamable_http">Streamable HTTP</option><option value="sse">SSE</option></select><label>MCP Token（可留空）</label><input type="password" name="mcp_token"><div class="actions"><button type="button" data-prev>[ 上一步 ]</button><button type="submit">[ 完成初始化 ]</button></div></section></form></div>
<script>(function(){var n=1,a=document.getElementById('apis'),ss=document.querySelectorAll('.step'),ls=document.querySelectorAll('.steps span');function add(){var i=a.children.length+1,d=document.createElement('div');d.className='api-item';d.innerHTML='<h2>API '+i+'</h2><label>API 名称</label><input name="api_name[]" value="API '+i+'" required><label>Base URL</label><input name="api_base_url[]" placeholder="http://127.0.0.1:8080/v1" required><label>API Key（可留空）</label><input type="password" name="api_key[]"><label>模型标识</label><input name="api_model[]" placeholder="your-model" required><button type="button" class="remove-api">[ 删除 ]</button>';d.querySelector('.remove-api').onclick=function(){d.remove()};a.appendChild(d)}function show(x){n=x;ss.forEach(function(e){e.classList.toggle('active',+e.dataset.step===x)});ls.forEach(function(e,i){e.classList.toggle('active',i+1===x)});scrollTo(0,0)}document.querySelectorAll('[data-next]').forEach(function(b){b.onclick=function(){if(n===2){var p=document.querySelector('[name=password]').value,c=document.querySelector('[name=confirm]').value;if(!document.querySelector('[name=username]').value||p.length<6||p!==c){alert('请正确填写管理员账号和密码');return}}if(n===3&&!a.children.length){alert('请至少添加一个 API');return}show(n+1)}});document.querySelectorAll('[data-prev]').forEach(function(b){b.onclick=function(){show(n-1)}});document.getElementById('add-api').onclick=add;add()})();</script>{% endblock %}
