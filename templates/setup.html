{% extends 'base.html' %}{% block content %}<h1>[ ZJAI-AGENT ]</h1><p class="cyan">首次启动设置向导</p><p class="gray">完成管理员、模型 API 和 MCP 服务初始化配置。</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><h2>管理员设置</h2><label>管理员账号</label><input name="username" required><label>管理员密码（至少 6 位）</label><input type="password" name="password" required><label>确认密码</label><input type="password" name="confirm" required><h2>默认模型 API</h2><label>模型名称</label><input name="model_name" value="默认模型"><label>OpenAI 兼容 Base URL</label><input name="base_url" placeholder="http://127.0.0.1:8080/v1"><label>API Key（可留空）</label><input type="password" name="api_key"><label>模型标识</label><input name="model" placeholder="your-model"><h2>MCP 服务</h2><label>MCP 地址（可留空）</label><input name="mcp_url" placeholder="http://127.0.0.1:9000/mcp"><label>协议</label><select name="mcp_protocol"><option value="streamable_http">Streamable HTTP</option><option value="sse">SSE</option></select><label>MCP Authorization Token（可留空）</label><input type="password" name="mcp_token"><button>[ 完成初始化 ]</button></form>{% endblock %}
