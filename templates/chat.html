{% extends 'base.html' %}{% block body_class %}chat-body{% endblock %}{% block main_class %}chat-app{% endblock %}{% block content %}
<div class="chat-layout">
<aside class="icon-rail"><div class="brand-mark">Z</div><a class="rail-icon active" href="/chat" title="聊天">▣</a><a class="rail-icon" href="/settings" title="设置">⚙</a>{% if user.role == 'admin' %}<a class="rail-icon" href="/AdminX" title="管理">□</a>{% endif %}<button class="rail-icon rail-bottom" id="logout" title="注销">↪</button></aside>
<aside class="conversation-panel" id="conversation-panel"><a class="new-chat" id="new" href="#">＋　开始新对话</a><div class="conversation-tools"><span>对话</span><button id="refresh" title="刷新">↻</button></div><div id="sessions" class="session-list"></div><div class="conversation-footer"><a href="/settings">设置中心</a><span>{{ user.username }}</span></div></aside>
<section class="chat-main"><header class="chat-header"><button class="mobile-menu" id="mobile-menu" type="button">☰</button><div class="model-select-wrap"><span class="model-symbol">Z</span><select id="model" aria-label="选择模型"></select><span class="chevron">⌄</span></div><div class="header-actions"><span id="status">● 就绪</span><a href="/settings">设置</a></div></header><div id="messages" class="message-area"><div id="empty-state" class="empty-state"><div class="empty-logo">Z</div><h1>有什么可以帮忙？</h1></div></div><div class="composer-wrap"><form id="form" class="composer"><textarea id="input" rows="1" placeholder="发送消息..." required></textarea><input id="file-input" type="file" accept=".txt,.md,.py,.js,.json,.html,.css,.bat,.sh,.yaml,.yml,.xml,.csv,.ini,.log" style="display:none"><div class="composer-bar"><button type="button" class="round-button" id="attach" title="附件">＋</button><span class="composer-hint">Enter 发送 · Shift+Enter 换行</span><button type="submit" id="send-button" class="send-button" title="发送">↑</button></div></form><div class="notice">AI 可能会出错，请检查重要信息。</div></div></section></div><script src="/static/chat_v8.js"></script>{% endblock %}
